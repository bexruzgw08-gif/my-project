# Render Blueprint for the KerakBo'lsa API (backend/).
# Render → New → Blueprint → select this repository. Secrets marked `sync: false`
# are asked for in the Render dashboard and are never stored in Git.
services:
  - type: web
    name: kerakbolsa-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.19.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DEMO_VERIFICATION
        value: "true"
      - key: SEED_ON_EMPTY
        value: "true"
